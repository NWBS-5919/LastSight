# Render Blueprint — 대시보드에서 "New +" → "Blueprint"로 이 저장소를 연결하면
# 아래 설정 그대로 서비스가 만들어진다. sync: false인 환경변수는 Render 대시보드에서
# 직접 값을 입력해야 한다(이 파일에는 값을 담지 않음 — 시크릿이므로).
services:
  - type: web
    name: lastsight-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPERB_AI_TENANT
        sync: false
      - key: SUPERB_AI_API_KEY
        sync: false
      - key: PPE_DEPLOYMENT_ID
        sync: false
      - key: FIRE_SMOKE_DEPLOYMENT_ID
        sync: false
